# Merge gate policy (aedis-build/aedis-platform merge-gate.yml). Always read from the default branch; anything not
# listed here needs a human.
schema: aedis.platform/merge-policy/v1
# Bots in quotes: the brackets of "[bot]" break the YAML list.
trustedAuthors: [jeffersonnlucas, "aedis-agent-coder[bot]"]
# Only members of this team count as the human review the paths below require (read by the gate App).
maintainersTeam: maintainers
humanRequiredPaths:
  - ".github/**"
  - CODEOWNERS
  - SECURITY.md
  - LICENSE
  - "LICENSES/**"
  - REUSE.toml
  - "docs/**"
  # The rendering and transport boundaries: where a change can turn agent text into script or leak a session.
  - "apps/www/lib/**"
  - apps/www/registry/aedis/ui/markdown.tsx
requiredSummaries: [coverage-summary, sast-summary]
coverageNoRegression: true
maxChangedLines: 2000
allowBreaking: false
mergeMethod: squash
