# Release of the registry: on a vX.Y.Z tag, builds the registry JSON, packs it, attests its provenance (SLSA, Sigstore)
# and publishes the archive plus the attestation bundle as release assets. The site keeps publishing from main.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

jobs:
  publish:
    name: Build, attest and publish the registry
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:build
      - name: Pack
        env:
          TAG: ${{ github.ref_name }}
        run: tar -czf "aedis-ui-registry-$TAG.tgz" -C apps/www/public r
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: aedis-ui-registry-*.tgz
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "aedis-ui-registry-$TAG.tgz.sigstore"
          gh release create "$TAG" "aedis-ui-registry-$TAG.tgz" "aedis-ui-registry-$TAG.tgz.sigstore" --generate-notes --verify-tag
