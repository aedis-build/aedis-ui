# Release of the registry on a vX.Y.Z tag: the Aedis Platform reusable builds the registry JSON in a job isolated
# from this repository (SLSA Build L3), packs it, attests its provenance (Sigstore) and publishes the archive, the
# attestation bundle the CLI verifies and the SBOM as release assets. The tag must be the version in package.json.
# The site keeps publishing from main. To check a published release:
#   gh attestation verify aedis-ui-registry-vX.Y.Z.tgz -R aedis-build/aedis-ui --signer-workflow aedis-build/aedis-platform/.github/workflows/release-registry-js.yml
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

jobs:
  release:
    uses: aedis-build/aedis-platform/.github/workflows/release-registry-js.yml@9983ddbea56afa122becdefd901d487cfc1b54ad # feat/visual-regression
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      name: aedis-ui-registry
      registry-dir: apps/www/public/r
