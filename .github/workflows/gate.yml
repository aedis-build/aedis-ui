# Merge gate: after every aedis-ci run on a pull request, evaluates .github/aedis-merge-policy.yaml and,
# when everything passes, approves as the "Aedis Compliance" GitHub App and enables auto-merge. Runs from main
# (workflow_run) and never checks out the pull request's code.
name: gate

on:
  workflow_run:
    workflows: [aedis-ci]
    types: [completed]

permissions: {}

jobs:
  gate:
    if: github.event.workflow_run.event == 'pull_request'
    uses: aedis-build/aedis-platform/.github/workflows/merge-gate.yml@ca3b4d1e7ce0f73244e62c18b0fcea99f163b2ac # v1.0.0
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    with:
      head-sha: ${{ github.event.workflow_run.head_sha }}
    secrets:
      app-id: ${{ secrets.AEDIS_APP_ID }}
      app-private-key: ${{ secrets.AEDIS_APP_PRIVATE_KEY }}
