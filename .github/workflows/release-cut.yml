# Releases as features land, through the Aedis Platform reusable release-cut.yml. On every push to main, the next
# version is derived from the Conventional Commits since the last tag (breaking → major, feat → minor,
# fix/perf/refactor/revert/deps → patch, anything else → no release) and proposed as a release pull request,
# "chore(release): vX.Y.Z", that bumps the version everywhere it lives: package.json (the registry),
# packages/cli/package.json and packages/cli/src/cli.ts, the thin packages aedis-cli, aedis-ui and create-aedis with
# their exact @aedis/cli pin, the `@aedis/cli@X.Y.Z` pins in the docs, and the lockfile. The PR goes through the same
# CI and gate as any change. When it merges, the reusable tags vX.Y.Z and cli-vX.Y.Z on that commit, and release.yml
# (signed registry) and cli-release.yml (npm Trusted Publishing) take over. Branch, PR and tags are made with the
# Aedis App's short-lived token. Nothing is proposed before the first tag exists: the first release is cut on purpose,
# with the bump input of a manual run. This file only holds the trigger and this repository's parameters.
name: release-cut

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump:
        description: "Increment (auto = from the commits since the last tag; patch/minor/major also cut the first release)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions: {}

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    uses: aedis-build/aedis-platform/.github/workflows/release-cut.yml@1c1cc77f25ebafc85ee7a683e5e6fd58b65c0312 # aedis-platform#75 (repin to the v1.0.0 tag once released)
    permissions:
      contents: read
    with:
      bump: ${{ inputs.bump || 'auto' }}
      tag-prefixes: v cli-v
      version-files: package.json packages/cli/package.json packages/aedis-cli/package.json packages/aedis-ui/package.json packages/create-aedis/package.json
      # The thin packages pin @aedis/cli to the version released with them.
      pin-dependency: "@aedis/cli"
      version-source: packages/cli/src/cli.ts
      version-source-pattern: 'export const VERSION = "{version}";'
      # The pinned install commands in the docs follow the release.
      pin-pattern: "@aedis/cli@"
      # Without this the release PR fails pnpm install --frozen-lockfile: the lockfile still says the old @aedis/cli.
      lockfile-command: pnpm install --lockfile-only
    secrets:
      app-id: ${{ secrets.AEDIS_APP_ID }}
      app-private-key: ${{ secrets.AEDIS_APP_PRIVATE_KEY }}
