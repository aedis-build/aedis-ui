# Visual regression of the theme (#40) through the Aedis Platform reusable: light, dark, reduced motion, reduced
# transparency and high contrast, in the official Playwright image pinned to the version in apps/www/package.json, so
# fonts and rendering are the same on every run. Baselines come only from here: add the label
# "update-visual-baselines" to a PR to regenerate them, download the "visual-baselines" artifact and commit it under
# apps/www/visual/__screenshots__ (a maintainer approves what it shows, #118).
name: visual

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions: {}

jobs:
  compare:
    if: github.event.action != 'labeled'
    uses: aedis-build/aedis-platform/.github/workflows/visual-regression.yml@9983ddbea56afa122becdefd901d487cfc1b54ad # feat/visual-regression
    permissions:
      contents: read
    with:
      working-directory: apps/www

  baselines:
    if: github.event.action == 'labeled' && github.event.label.name == 'update-visual-baselines'
    uses: aedis-build/aedis-platform/.github/workflows/visual-regression.yml@9983ddbea56afa122becdefd901d487cfc1b54ad # feat/visual-regression
    permissions:
      contents: read
    with:
      working-directory: apps/www
      mode: update
