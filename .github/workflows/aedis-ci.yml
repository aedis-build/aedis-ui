# Single quality pipeline of aedis-ui: calls aedis-ci from Aedis Platform (Conventional Commits, tests with the 95/85
# coverage gate and no regression, typecheck and build of the site and the CLI, SAST with the Aedis and Next.js
# rules, CodeQL security-extended, REUSE, and a DAST baseline against the static site and the registry JSON).
# The pipeline belongs to the platform; this file only holds the trigger, the permissions and the repository's
# parameters. On pull requests it runs for any base, so stacked pull requests are validated too.
name: aedis-ci

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: "29 5 * * 2"

# One run per pull request: a new push or closing the PR cancels the run in progress. Pushes to main and the
# schedule never share a group (run_id), so those runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  aedis:
    if: github.event.action != 'closed'
    uses: aedis-build/aedis-platform/.github/workflows/aedis-ci.yml@840efbb78e50bb957729bf7b7554dba0721cd83b # main
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
      id-token: write
    with:
      language: node
      coverage-script: test:coverage
      coverage-reports: apps/www/coverage/cobertura-coverage.xml
      min-line: 95
      min-branch: 85
      no-regression: true
      # smoke: packs @aedis/cli as npm would publish it, installs the tarball in a scratch project and runs init, add
      # and diff against the registry built here (scripts/smoke.mjs), so every PR proves the release path.
      check-scripts: typecheck build smoke
      reuse: true
      codeql-queries: security-extended
      sast-extra-configs: p/nextjs
      # Served by the repo's pinned wrangler with the real _headers, as Cloudflare serves it; local mode needs no login.
      dast-start: "pnpm site:build && (WRANGLER_SEND_METRICS=false pnpm exec wrangler dev --ip 127.0.0.1 --port 8080 > dast-server.log 2>&1 &)"
      dast-fail-on: Medium
      platform-ref: 7bc8fa3ae92c8213db88b7191b30c3c6249f1efa
