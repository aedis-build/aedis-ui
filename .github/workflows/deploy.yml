# Deploy the docs site and the registry JSON (/r/<name>.json) to Cloudflare on every push to main (the ruleset only
# lets changes reach main through a reviewed pull request with CI green). Build, SBOM, SLSA Build L3 attestation,
# verification and upload come from the deploy-static reusable workflow of Aedis Platform. The Cloudflare token lives
# only in the prd environment (main only, required reviewer, no admin bypass). To check what is live:
#   gh attestation verify aedis-ui-www.tgz -R aedis-build/aedis-ui --signer-workflow aedis-build/aedis-platform/.github/workflows/deploy-static.yml
name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    uses: aedis-build/aedis-platform/.github/workflows/deploy-static.yml@177a6c164de12e82a23aae67107294d2439e406b # main
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      name: aedis-ui-www
      build-script: site:build
      out-dir: apps/www/out
      url: https://ui.aedis.build
    # A reusable workflow only sees the secrets its caller passes, even in a job that declares the prd
    # environment. inherit hands it CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; the prd protection rules
    # (main only, required reviewer) still gate the job that reads them.
    secrets: inherit

  # DAST baseline (OWASP ZAP) against what is live, headers included; accepted alerts in dast-accept.yaml.
  dast:
    name: DAST (live site)
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aedis-build/aedis-platform/.github/actions/dast@177a6c164de12e82a23aae67107294d2439e406b # main
        with:
          target-url: https://ui.aedis.build/
          fail-on: Medium
