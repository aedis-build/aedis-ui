# Publishes @aedis/cli on a cli-vX.Y.Z tag through the Aedis Platform reusable: typecheck, tests with coverage and
# build in packages/cli, SBOM, then npm Trusted Publishing (OIDC) with provenance. No npm token is stored anywhere;
# npm records this repository, this workflow and this commit. The tag must match the package version. Then the
# three thin packages that keep the names around it (aedis-cli, aedis-ui, create-aedis: a bin over the exact
# @aedis/cli version just published) go out the same way, one job each. On npmjs.com each package's trusted
# publisher is this file (cli-release.yml) in the npm environment, with 2FA required and tokens disallowed.
#
# Each job packs once and publishes, attests and uploads that one file; the last job (the platform's release-attach)
# verifies the four attestations and attaches the tarballs, their Sigstore bundles and their integrity to the GitHub
# release cli-vX.Y.Z, so the same bytes npm received can be installed offline and audited (#151, "Verified offline
# install" in the README). This file only holds the triggers, the permissions and this repository's parameters.
name: cli-release

on:
  push:
    tags: ["cli-v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  publish:
    uses: aedis-build/aedis-platform/.github/workflows/release-npm.yml@ca3b4d1e7ce0f73244e62c18b0fcea99f163b2ac # v1.0.0
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      package-dir: packages/cli
      tag-prefix: cli-
      node-version: "24"

  # After @aedis/cli, so each one's exact dependency exists on npm when it is published.
  names:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        package: [aedis-cli, aedis-ui, create-aedis]
    uses: aedis-build/aedis-platform/.github/workflows/release-npm.yml@ca3b4d1e7ce0f73244e62c18b0fcea99f163b2ac # v1.0.0
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      package-dir: packages/${{ matrix.package }}
      tag-prefix: cli-
      check-scripts: ""
      build-script: ""
      node-version: "24"

  release:
    needs: [publish, names]
    uses: aedis-build/aedis-platform/.github/workflows/release-attach.yml@ca3b4d1e7ce0f73244e62c18b0fcea99f163b2ac # v1.0.0
    permissions:
      contents: write
    with:
      title: "@aedis/cli ${{ github.ref_name }}"
