# Publishes @aedis/cli on a cli-vX.Y.Z tag through the Aedis Platform reusable: typecheck, tests with coverage and
# build in packages/cli, SBOM, then npm Trusted Publishing (OIDC) with provenance. No npm token is stored anywhere;
# npm records this repository, this workflow and this commit. The tag must match the package version. Then the
# three thin packages that keep the names around it (aedis-cli, aedis-ui, create-aedis: a bin over the exact
# @aedis/cli version just published) go out the same way, one job each. On npmjs.com each package's trusted
# publisher is this file (cli-release.yml) in the npm environment, with 2FA required and tokens disallowed.
#
# Each job packs once and publishes, attests and uploads that one file; the last job verifies the four attestations
# and attaches the tarballs, their Sigstore bundles and their integrity to the GitHub release cli-vX.Y.Z, so the
# same bytes npm received can be installed offline and audited (#151, "Verified offline install" in the README).
name: cli-release

on:
  push:
    tags: ["cli-v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  publish:
    uses: aedis-build/aedis-platform/.github/workflows/release-npm.yml@894a4d3f3996f7e93ab45966dc58c2d2a5584350 # main
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      package-dir: packages/cli
      tag-prefix: cli-
      node-version: "24"

  # After @aedis/cli, so each one's exact dependency exists on npm when it is published.
  names:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        package: [aedis-cli, aedis-ui, create-aedis]
    uses: aedis-build/aedis-platform/.github/workflows/release-npm.yml@894a4d3f3996f7e93ab45966dc58c2d2a5584350 # main
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      package-dir: packages/${{ matrix.package }}
      tag-prefix: cli-
      check-scripts: ""
      build-script: ""
      node-version: "24"

  release:
    name: Attach the tarballs and attestations to the GitHub release
    needs: [publish, names]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: npm-*
          merge-multiple: true
          path: assets
      - name: Verify every tarball against its attestation from the platform's publish workflow
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l assets
          for tgz in assets/*.tgz; do
            gh attestation verify "$tgz" -R "$REPO" \
              --signer-workflow aedis-build/aedis-platform/.github/workflows/release-npm.yml
            # The bundle shipped next to it must be the one that verifies, not a stale copy.
            gh attestation verify "$tgz" -R "$REPO" --bundle "$tgz.sigstore" \
              --signer-workflow aedis-build/aedis-platform/.github/workflows/release-npm.yml
          done
      - name: Release notes with the integrity npm shows
        run: |
          set -euo pipefail
          {
            echo "The npm tarballs of this release, byte for byte what npm received, with their Sigstore attestation (\`<tgz>.sigstore\`)."
            echo "Verify and install offline: \`gh attestation verify <tgz> --owner aedis-build && npm install ./<tgz>\`. The integrity is the \`sha512-…\` that \`npm view <package> dist.integrity\` shows."
            echo
            echo "| Tarball | integrity |"
            echo "|---|---|"
            for tgz in assets/*.tgz; do echo "| \`$(basename "$tgz")\` | \`$(cat "$tgz.integrity")\` |"; done
          } > notes.md
          cat notes.md
      - name: GitHub release cli-vX.Y.Z with the tarballs and bundles
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "@aedis/cli $TAG" --notes-file notes.md --verify-tag
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber assets/*.tgz assets/*.tgz.sigstore
