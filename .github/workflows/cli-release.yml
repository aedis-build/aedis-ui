# Publishes @aedis/cli on a cli-vX.Y.Z tag through the Aedis Platform reusable: typecheck, tests with coverage and
# build in packages/cli, SBOM, then npm Trusted Publishing (OIDC) with provenance. No npm token is stored anywhere;
# npm records this repository, this workflow and this commit. The tag must match the package version. On npmjs.com
# the package's trusted publisher is this file (cli-release.yml) in the npm environment, with 2FA required and
# tokens disallowed.
name: cli-release

on:
  push:
    tags: ["cli-v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  publish:
    uses: aedis-build/aedis-platform/.github/workflows/release-npm.yml@3a42caac428d5581312a4a83cf1d7a6487a181f0 # feat/visual-regression
    permissions:
      contents: read
      id-token: write
    with:
      package-dir: packages/cli
      tag-prefix: cli-
      node-version: "24"
