# Publishes @aedis/cli on a cli-vX.Y.Z tag with npm Trusted Publishing (OIDC): no npm token is stored anywhere, and
# npm records the provenance (this repository, this workflow, this commit). The tag must match the package version.
# The package itself is configured on npmjs.com to require 2FA and disallow tokens.
name: cli-release

on:
  push:
    tags: ["cli-v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  publish:
    name: Test, build and publish @aedis/cli
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: test "cli-v$(node -p "require('./packages/cli/package.json').version")" = "$TAG"
      - run: pnpm -C packages/cli typecheck
      - run: pnpm -C packages/cli test:coverage
      - run: pnpm -C packages/cli build
      # Trusted Publishing needs a recent npm; pinned like every other tool here.
      - run: npx --yes npm@12.2.0 publish --provenance --access public
        working-directory: packages/cli
