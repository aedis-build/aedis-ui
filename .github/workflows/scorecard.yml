# OpenSSF Scorecard through the Aedis Platform reusable: weekly, on push to main and by hand; results published to
# the Scorecard API (public badge) and the SARIF to code scanning. This file only holds the trigger and permissions.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    uses: aedis-build/aedis-platform/.github/workflows/scorecard.yml@1c1cc77f25ebafc85ee7a683e5e6fd58b65c0312 # aedis-platform#75 (repin to the v1.0.0 tag once released)
    permissions:
      contents: read
      security-events: write
      id-token: write
