# SAST: Semgrep with the public rulesets plus the shared Aedis rules (C# and TypeScript) through the reusable
# workflow of Aedis Platform. SARIF goes to code scanning; sast-summary.json is the retained evidence.
name: sast

on:
  push:
    branches: [ main ]
  pull_request:

permissions: {}

jobs:
  sast:
    uses: aedis-build/aedis-platform/.github/workflows/sast.yml@820bfc78a548c3fcc98a5b9e303c93fa3a368243
    permissions:
      contents: read
      security-events: write
    with:
      platform-ref: 820bfc78a548c3fcc98a5b9e303c93fa3a368243
      extra-configs: p/javascript p/typescript p/react p/nextjs
