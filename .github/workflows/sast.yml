# SAST: Semgrep with the public rulesets plus the shared Aedis rules (C# and TypeScript) through the reusable
# workflow of Aedis Platform. SARIF goes to code scanning; sast-summary.json is the retained evidence.
name: sast

on:
  push:
    branches: [ main ]
  pull_request:

permissions: {}

jobs:
  sast:
    uses: aedis-build/aedis-platform/.github/workflows/sast.yml@e83f3b489f26c7bd8276e035f4213f89f254ed08
    permissions:
      contents: read
      security-events: write
    with:
      platform-ref: e83f3b489f26c7bd8276e035f4213f89f254ed08
      extra-configs: p/javascript p/typescript p/react p/nextjs
