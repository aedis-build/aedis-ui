# Every PR: Conventional Commits, tests with the Aedis Platform coverage gate (95 % lines, 85 % branches, no
# regression), typecheck, registry and static site build, and a DAST baseline against the built site. The gates,
# rules and summaries come from aedis-platform; this repository carries no glue of its own.
# Actions pinned by SHA; minimal permissions; no long-lived credentials.
name: CI

on:
  push:
    branches: [ main ]
  # Every PR, including stacked ones that target a feature branch.
  pull_request:

permissions: {}

jobs:
  commits:
    if: github.event_name == 'pull_request'
    uses: aedis-build/aedis-platform/.github/workflows/conventional-commits.yml@33c000e3effbd9151212c77aa29c24646ec6e5dc # v1
    permissions:
      contents: read

  coverage:
    uses: aedis-build/aedis-platform/.github/workflows/coverage-js.yml@e83f3b489f26c7bd8276e035f4213f89f254ed08
    permissions:
      contents: read
      actions: read
    with:
      script: test:coverage
      reports: apps/www/coverage/cobertura-coverage.xml
      min-line: 95
      min-branch: 85
      no-regression: true
      platform-ref: e83f3b489f26c7bd8276e035f4213f89f254ed08

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # DAST baseline (OWASP ZAP) against the exposed surface: the docs site and the registry JSON.
      - run: python3 -m http.server 8080 -d apps/www/out &
      - uses: aedis-build/aedis-platform/.github/actions/dast@e83f3b489f26c7bd8276e035f4213f89f254ed08
        with:
          target-url: http://localhost:8080/

  reuse:
    name: REUSE (license and copyright on every file)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run reuse==5.0.2 lint
