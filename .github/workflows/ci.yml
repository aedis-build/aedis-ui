# Typecheck, tests (behavior + accessibility), registry build and static site build on every PR.
# Actions pinned by SHA; minimal permissions; no long-lived credentials.
name: CI

on:
  push:
    branches: [ main ]
  # Every PR, including stacked ones that target a feature branch.
  pull_request:

permissions: {}

jobs:
  commits:
    if: github.event_name == 'pull_request'
    uses: aedis-build/aedis-platform/.github/workflows/conventional-commits.yml@33c000e3effbd9151212c77aa29c24646ec6e5dc # v1
    permissions:
      contents: read

  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
