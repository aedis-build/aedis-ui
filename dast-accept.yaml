# Accepted DAST (ZAP) alerts, read by the Aedis Platform DAST action. Each item has pluginId, until and reason.
# Accepted by the maintainer on 2026-10-22 for 90 days (aedis-ui#94); each reason says what would remove it.
accept:
  - pluginId: 10038
    until: 2027-01-20
    reason: "No CSP on unknown paths (the 404 page, which holds no data or session): _headers cannot give it a policy without a detach, which production ignored on /; remove once Cloudflare honours the detach or the 404 gets a CSP another way."
  - pluginId: 10099
    until: 2027-01-20
    reason: "False positive: 'SQL source code disclosure' matches English prose on /docs/use-idle-timeout; remove if the alert ever points at real code or a non-prose page."
  - pluginId: 90003
    until: 2027-01-21
    paths: [/llms-full.txt]
    reason: "False positive: 'Sub Resource Integrity Attribute Missing' matches a code sample in /llms-full.txt (text/plain, the docs for coding agents: <Link href={source.url}>), not a resource any page loads; remove if the alert ever points at an HTML page or a real <script>/<link>."
