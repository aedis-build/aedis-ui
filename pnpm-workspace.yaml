packages:
  - apps/*
  - packages/*

# Supply chain: no git, tarball or URL transitive dependencies; a new version must be a week old before it can be
# installed (the same cooldown as Dependabot); an update can never resolve to a lower version than the lockfile has.
blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# semver 6.x is still required by @babel/core (via shadcn); its last publish (2023) predates provenance, which
# no-downgrade reads as a takeover. Excluded by name; every other package keeps the policy.
trustPolicyExclude:
  - semver
# aedis-cli, aedis-ui and create-aedis depend on the exact @aedis/cli version of the same checkout: linked here,
# published as a plain version (no workspace: protocol, so npm publish ships it as is).
linkWorkspacePackages: true

# Transitive advisories (dev tooling only: shadcn, miniflare, jsdom, dotenvx). undici < 7.30.1 is forced to the fixed
# release, body-parser to 2.4.0; zod 4.x cannot be forced (its dependants require zod 3), see deps-accept.yaml.
overrides:
  "undici@>=7.0.0 <7.30.1": 7.30.1
  "systeminformation@<5.33.16": 5.33.16
  "body-parser@>=2.0.0 <2.4.0": 2.4.0
